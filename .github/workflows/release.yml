# Release-Pipeline der Linux-App (Owner-Entscheidung F15, 31.10.2026: eigenes Flatpak-Repo + .deb statt Flathub).
#
# Auslöser:
#  - Tag vX.Y.Z auf einem Commit in main → bauen, testen, Flatpak-Repo signieren, nach rog-public hochladen
#    (https://cdn.rogclan.de/apps/linux/), GitHub-Release mit .deb, Tarballs, Flatpak-Bundles und .flatpakref.
#  - workflow_dispatch → Probelauf: alles bauen und prüfen (inkl. Installation aus dem signierten Repo), aber NIE
#    hochladen und kein Release; signiert wird mit einem Wegwerf-Schlüssel, Secrets werden nie geladen.
# Härtung (Audit M2): Actions per Commit-SHA gepinnt (Dependabot hebt sie an), Rechte je Job minimal, Secrets nur in
# den Schritten, die sie brauchen; GPG-Schlüssel nur im Signier-Job (ohne PPA-Pakete), S3 nur in den Upload-Schritten;
# Signieren und Hochladen bei Tags in der Umgebung „release“ (nur Tags v*, Freigabe durch den Owner).
# Fehlen die S3-Secrets ROG_PUBLIC_APPS_KEY_ID/ROG_PUBLIC_APPS_SECRET, werden die Upload-Schritte mit Hinweis
# übersprungen (Artefakte entstehen trotzdem; das GitHub-Release wird dann nur als Entwurf angelegt).
# Ablauf und Owner-Schritte: packaging/README.md
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  APP_ID: com.rebelsofgaming.RebelsOfGaming

jobs:
  check:
    name: Version prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag liegt auf main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} liegt nicht auf main – Releases nur von main (CLAUDE.md)"
            exit 1
          fi

      - name: Version = Tag = AppStream
        id: version
        run: |
          props="$(sed -n 's:.*<RoGLinuxVersion>\(.*\)</RoGLinuxVersion>.*:\1:p' Directory.Build.props)"
          metainfo="packaging/linux/$APP_ID.metainfo.xml"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$props" ]; then
              echo "::error::Tag v$tag passt nicht zu RoGLinuxVersion $props (Directory.Build.props)"
              exit 1
            fi
            if ! grep -Eq "<release version=\"$tag\"[^>]*type=\"stable\"" "$metainfo"; then
              echo "::error::$metainfo braucht einen Eintrag <release version=\"$tag\" date=\"…\" type=\"stable\">"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Probelauf (workflow_dispatch) – es wird nichts hochgeladen und kein Release angelegt"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$props" >> "$GITHUB_OUTPUT"

  packages:
    name: Tarball + .deb ${{ matrix.arch }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        # aarch64 per Cross-Publish (linux-arm64) auf dem x86_64-Runner – .NET braucht dafür keinen arm64-Rechner;
        # Tests und Installationsprobe nur für x86_64
        arch: [x86_64, aarch64]
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build + Tests
        if: matrix.arch == 'x86_64'
        run: |
          dotnet build RoG.Linux.sln -c Release
          dotnet test RoG.Linux.sln -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Tarball
        run: packaging/scripts/make-tarball.sh "${{ matrix.arch }}"

      - name: .deb
        run: packaging/scripts/make-deb.sh "${{ matrix.arch }}"

      - name: .deb prüfen (lintian, Installation, Start unter Xvfb)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian xvfb xauth dbus
          deb="artifacts/dist/rebelsofgaming_${VERSION}_amd64.deb"
          lintian --tag-display-limit 0 --fail-on error,warning "$deb"
          sudo apt-get install -y --no-install-recommends "./$deb"
          set +e
          dbus-run-session -- xvfb-run -a timeout 20 rebelsofgaming --x11
          code=$?
          set -e
          # 124 = lief bis zum Timeout (Fenster offen) – alles andere ist ein Absturz beim Start
          [ "$code" = 124 ] || { echo "::error::Start aus dem .deb fehlgeschlagen (Exit $code)"; exit 1; }
          sudo apt-get remove -y rebelsofgaming

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: |
            artifacts/dist/*.tar.gz
            artifacts/dist/*.deb
            artifacts/dist/*.sha256
          if-no-files-found: error
          retention-days: 90

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # Nativer arm64-Runner (für öffentliche Repos kostenlos) – kein qemu
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: flatpak-builder installieren
        run: |
          # Ubuntu 24.04 hat flatpak 1.14 – --device=input (Controller) kennt erst 1.15.6 → aktuelles flatpak aus dem PPA
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak --version
          # Ubuntu 24.04 sperrt unprivilegierte User-Namespaces per AppArmor – bubblewrap braucht sie
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Flatpak bauen (aus dem Quelltext, ohne Netz)
        env:
          ROG_FLATPAK_DEPS_FROM: flathub
        run: packaging/scripts/flatpak-build.sh "${{ matrix.arch }}" "$PWD/artifacts/flatpak/repo-${{ matrix.arch }}"

      - name: Repo packen
        run: tar -C artifacts/flatpak -cf "flatpak-repo-${{ matrix.arch }}.tar" "repo-${{ matrix.arch }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: flatpak-repo-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 14

  # Signieren: einziger Job mit dem GPG-Schlüssel. Nur Werkzeuge aus dem Ubuntu-Archiv (kein PPA – fremde Pakete
  # laufen nie neben dem privaten Schlüssel). Signieren braucht kein flatpak ≥ 1.15.6, nur build-commit-from/
  # build-update-repo/build-bundle. Release (Tag): Umgebung „release“ (nur Tags v*, Freigabe durch den Owner);
  # Probelauf: Wegwerf-Schlüssel, keine Secrets.
  sign:
    name: Repo signieren
    needs: [check, packages, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ needs.check.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PUBLISH: ${{ needs.check.outputs.publish }}
      GPG_KEY_ID: ${{ vars.ROG_FLATPAK_GPG_KEY_ID }}
      S3_ENDPOINT: https://s3.wahke.lu
      S3_BASE: s3://rog-public/apps/linux
      CDN_BASE: https://cdn.rogclan.de/apps/linux
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flatpak-repo-*
          path: artifacts/flatpak
          merge-multiple: true

      - name: Werkzeuge (Ubuntu-Archiv)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak ostree
          flatpak --version
          for t in artifacts/flatpak/flatpak-repo-*.tar; do tar -C artifacts/flatpak -xf "$t"; done

      - name: Bestehendes Repo aus rog-public laden
        if: env.PUBLISH == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ROG_PUBLIC_APPS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ROG_PUBLIC_APPS_SECRET }}
        run: |
          # Neue Commits hängen am Vorgänger → Clients laden nur Deltas
          mkdir -p artifacts/flatpak/repo
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::Kein S3-Zugang – Repo wird neu angelegt (Upload später übersprungen)"; exit 0
          fi
          aws configure set default.s3.addressing_style path
          aws --endpoint-url "$S3_ENDPOINT" s3 sync "$S3_BASE/flatpak/" artifacts/flatpak/repo/ --only-show-errors
          [ -f artifacts/flatpak/repo/config ] || echo "::notice::Noch kein Repo in rog-public – wird neu angelegt"

      - name: Schlüssel laden, Repo zusammenführen und signieren
        env:
          GPG_PRIVATE_KEY: ${{ needs.check.outputs.publish == 'true' && secrets.ROG_FLATPAK_GPG_PRIVATE_KEY || '' }}
        run: |
          # Der private Schlüssel lebt nur in diesem Schritt (eigenes GNUPGHOME, danach gelöscht)
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT
          mkdir -p artifacts/keys
          if [ "$PUBLISH" = true ]; then
            if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_KEY_ID" ]; then
              echo "::error::Secret ROG_FLATPAK_GPG_PRIVATE_KEY bzw. Variable ROG_FLATPAK_GPG_KEY_ID fehlt – ohne Signatur kein Release"
              exit 1
            fi
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
            unset GPG_PRIVATE_KEY
            # Der geladene Schlüssel muss zum öffentlichen Schlüssel im Repo passen (dem die Nutzer vertrauen)
            want="$(gpg --with-colons --fingerprint "$GPG_KEY_ID" | awk -F: '/^fpr/{print $10; exit}')"
            have="$(gpg --with-colons --import-options show-only --import packaging/flatpak/rebelsofgaming.gpg | awk -F: '/^fpr/{print $10; exit}')"
            if [ -z "$want" ] || [ "$want" != "$have" ]; then
              echo "::error::Signierschlüssel passt nicht zu packaging/flatpak/rebelsofgaming.gpg"; exit 1
            fi
            cp packaging/flatpak/rebelsofgaming.gpg artifacts/keys/repo.gpg
          else
            echo "::notice::Probelauf – Wegwerf-Schlüssel, keine Secrets"
            gpg --batch --passphrase '' --quick-gen-key "RoG CI dry run" rsa3072 sign 1d
            gpg --export > artifacts/keys/repo.gpg
            GPG_KEY_ID="$(gpg --with-colons --list-keys | awk -F: '/^fpr/{print $10; exit}')"
          fi
          echo "$GPG_KEY_ID" > artifacts/keys/key-id
          ROG_FLATPAK_PUBLIC_KEY="$PWD/artifacts/keys/repo.gpg" \
            packaging/scripts/flatpak-repo.sh artifacts/flatpak/repo "$GPG_KEY_ID" \
            artifacts/flatpak/repo-x86_64 artifacts/flatpak/repo-aarch64

      - name: Flatpak-Bundles (Offline-Installation, Updates danach über das Repo)
        run: |
          mkdir -p artifacts/bundles
          for a in x86_64 aarch64; do
            bundle="artifacts/bundles/rebelsofgaming-$VERSION-$a.flatpak"
            flatpak build-bundle --arch="$a" --gpg-keys=artifacts/keys/repo.gpg \
              --repo-url="$CDN_BASE/flatpak/" --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
              artifacts/flatpak/repo "$bundle" "$APP_ID" stable
            (cd artifacts/bundles && sha256sum "$(basename "$bundle")" > "$(basename "$bundle").sha256")
          done
          ls -l artifacts/bundles
          tar -C artifacts -cf signed-repo.tar flatpak/repo bundles keys

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-repo
          path: signed-repo.tar
          if-no-files-found: error
          retention-days: 14

  # Installationsprobe aus dem signierten Repo: braucht flatpak ≥ 1.15.6 (--device=input) aus dem PPA – deshalb in
  # einem eigenen Job ohne jedes Secret.
  verify:
    name: Aus dem signierten Repo installieren
    needs: [check, packages, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CDN_BASE: https://cdn.rogclan.de/apps/linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: artifacts/dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-repo
          path: artifacts

      - name: Werkzeuge
        run: |
          # Ubuntu 24.04 hat flatpak 1.14 – --device=input (Controller) kennt erst 1.15.6 → aktuelles flatpak aus dem PPA
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak xvfb xauth dbus
          flatpak --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Laufzeit für die Installationsprobe (RuntimeRepo der .flatpakref)
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          tar -C artifacts -xf artifacts/signed-repo.tar
          mv artifacts/bundles/* artifacts/dist/
          (cd artifacts/dist && sha256sum -c ./*.sha256)

      - name: Aus dem signierten Repo installieren und starten (x86_64)
        run: |
          sed -e "s#^Url=.*#Url=file://$PWD/artifacts/flatpak/repo#" \
              -e "s#^GPGKey=.*#GPGKey=$(base64 -w0 artifacts/keys/repo.gpg)#" \
              "packaging/flatpak/$APP_ID.flatpakref" > "$RUNNER_TEMP/test.flatpakref"
          flatpak --user install -y --noninteractive "$RUNNER_TEMP/test.flatpakref"
          flatpak --user info "$APP_ID"
          flatpak --user info --show-permissions "$APP_ID" | tee "$RUNNER_TEMP/permissions.txt"
          # Audit M1: kein Zugriff auf den ganzen Schlüsselbund
          if grep -q 'org.freedesktop.secrets' "$RUNNER_TEMP/permissions.txt"; then
            echo "::error::Flatpak darf org.freedesktop.secrets nicht direkt ansprechen (Secret-Portal nutzen)"; exit 1
          fi
          flatpak --user remote-ls --all rebelsofgaming
          set +e
          dbus-run-session -- xvfb-run -a timeout 30 flatpak run --user "$APP_ID" --x11
          code=$?
          set -e
          [ "$code" = 124 ] || { echo "::error::Start des Flatpaks fehlgeschlagen (Exit $code)"; exit 1; }

      - name: Einstiegsdateien und Übersicht
        run: |
          mkdir -p artifacts/release
          cp "packaging/flatpak/$APP_ID.flatpakref" packaging/flatpak/rebelsofgaming.flatpakrepo \
             packaging/flatpak/rebelsofgaming.gpg artifacts/release/
          python3 -I - <<'PY'
          import json, os, pathlib
          v = os.environ["VERSION"]; cdn = os.environ["CDN_BASE"]; dist = pathlib.Path("artifacts/dist")
          files = {}
          for f in sorted(dist.glob("*.deb")) + sorted(dist.glob("*.tar.gz")) + sorted(dist.glob("*.flatpak")):
              files[f.name] = {"url": f"{cdn}/{v}/{f.name}",
                               "sha256": (dist / f"{f.name}.sha256").read_text().split()[0],
                               "size": f.stat().st_size}
          data = {"version": v, "flatpakref": f"{cdn}/{os.environ['APP_ID']}.flatpakref",
                  "flatpakrepo": f"{cdn}/rebelsofgaming.flatpakrepo", "files": files}
          pathlib.Path("artifacts/release/latest.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
          cat artifacts/release/latest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.check.outputs.version }}
          path: |
            artifacts/dist/*.tar.gz
            artifacts/dist/*.deb
            artifacts/dist/*.flatpak
            artifacts/dist/*.sha256
            artifacts/release/*
          if-no-files-found: error
          retention-days: 90

  # Hochladen + GitHub-Release: nur bei Tag, Umgebung „release“. Keine Paketquellen von Dritten, nur die AWS-CLI des
  # Runners; S3-Zugang nur in den Upload-Schritten.
  publish:
    name: Hochladen und Release
    needs: [check, sign, verify]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      S3_ENDPOINT: https://s3.wahke.lu
      S3_BASE: s3://rog-public/apps/linux
      CDN_BASE: https://cdn.rogclan.de/apps/linux
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      # Ohne diese beiden lädt die AWS-CLI (≥ 2.23) „aws-chunked“ hoch; SeaweedFS speichert das als
      # Content-Encoding und das CDN liefert es aus – Browser und flatpak lehnen die Dateien dann ab
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-repo
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.check.outputs.version }}
          path: artifacts

      - name: Dateien prüfen
        run: |
          tar -C artifacts -xf artifacts/signed-repo.tar flatpak/repo keys
          (cd artifacts/dist && sha256sum -c ./*.sha256)
          echo "GPG_KEY_ID=$(cat artifacts/keys/key-id)" >> "$GITHUB_ENV"
          ls -l artifacts/dist artifacts/release

      - name: S3-Zugang vorhanden?
        id: s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ROG_PUBLIC_APPS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ROG_PUBLIC_APPS_SECRET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice title=Upload übersprungen::Secrets ROG_PUBLIC_APPS_KEY_ID/ROG_PUBLIC_APPS_SECRET fehlen – nichts wird nach rog-public hochgeladen (Owner-Schritte: packaging/README.md)"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            aws configure set default.s3.addressing_style path
            # s3api statt „s3 ls“: „s3 ls“ endet bei leerem Präfix (erster Upload) mit Code 1
            path="${S3_BASE#s3://}"
            aws --endpoint-url "$S3_ENDPOINT" s3api list-objects-v2 --bucket "${path%%/*}" --prefix "${path#*/}/" \
              --max-keys 1 > /dev/null
            echo "S3-Zugang ok (lesend geprüft)"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload nach rog-public (apps/linux/)
        if: steps.s3.outputs.available == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ROG_PUBLIC_APPS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ROG_PUBLIC_APPS_SECRET }}
        run: |
          aws configure set default.s3.addressing_style path
          s3() { aws --endpoint-url "$S3_ENDPOINT" s3 "$@" --only-show-errors; }
          immutable="public, max-age=31536000, immutable"
          short="public, max-age=60"
          bin=application/octet-stream

          # 1. Versionierte Pakete – nie überschreiben
          if aws --endpoint-url "$S3_ENDPOINT" s3 ls "$S3_BASE/$VERSION/" | grep -q .; then
            echo "::error::$S3_BASE/$VERSION/ existiert schon – Version erhöhen statt überschreiben"; exit 1
          fi
          for f in artifacts/dist/*.deb; do
            s3 cp "$f" "$S3_BASE/$VERSION/" --content-type application/vnd.debian.binary-package --cache-control "$immutable"
          done
          for f in artifacts/dist/*.tar.gz; do
            s3 cp "$f" "$S3_BASE/$VERSION/" --content-type application/gzip --cache-control "$immutable"
          done
          for f in artifacts/dist/*.flatpak; do
            s3 cp "$f" "$S3_BASE/$VERSION/" --content-type application/vnd.flatpak --cache-control "$immutable"
          done
          for f in artifacts/dist/*.sha256; do
            s3 cp "$f" "$S3_BASE/$VERSION/" --content-type "text/plain; charset=utf-8" --cache-control "$immutable"
          done

          # 2. Flatpak-Repo: erst Inhalte (unveränderlich, nach Prüfsumme benannt), zuletzt Refs und Summary –
          #    Clients sehen nie eine Summary, deren Objekte noch fehlen. tmp/, state/, .lock bleiben lokal.
          repo=artifacts/flatpak/repo
          s3 sync "$repo/objects" "$S3_BASE/flatpak/objects" --size-only --content-type "$bin" --cache-control "$immutable"
          if [ -d "$repo/deltas" ]; then
            s3 sync "$repo/deltas" "$S3_BASE/flatpak/deltas" --size-only --content-type "$bin" --cache-control "$immutable"
          fi
          for d in delta-indexes summaries refs; do
            if [ -d "$repo/$d" ]; then
              s3 sync "$repo/$d" "$S3_BASE/flatpak/$d" --delete --exact-timestamps --content-type "$bin" --cache-control "$short"
            fi
          done
          for f in config summary.idx summary.idx.sig summary summary.sig; do
            if [ -f "$repo/$f" ]; then
              s3 cp "$repo/$f" "$S3_BASE/flatpak/$f" --content-type "$bin" --cache-control "$short"
            fi
          done
          # Vom Prune entfernte Objekte/Deltas erst jetzt löschen
          s3 sync "$repo/objects" "$S3_BASE/flatpak/objects" --size-only --delete --content-type "$bin" --cache-control "$immutable"
          if [ -d "$repo/deltas" ]; then
            s3 sync "$repo/deltas" "$S3_BASE/flatpak/deltas" --size-only --delete --content-type "$bin" --cache-control "$immutable"
          fi

          # 3. Einstiegsdateien, Übersicht, feste Namen der neuesten Pakete, Symbol und Screenshots
          s3 cp "artifacts/release/$APP_ID.flatpakref" "$S3_BASE/" --content-type application/vnd.flatpak.ref --cache-control "$short"
          s3 cp artifacts/release/rebelsofgaming.flatpakrepo "$S3_BASE/" --content-type application/vnd.flatpak.repo --cache-control "$short"
          s3 cp artifacts/release/rebelsofgaming.gpg "$S3_BASE/" --content-type application/pgp-keys --cache-control "$short"
          s3 cp artifacts/release/latest.json "$S3_BASE/" --content-type "application/json; charset=utf-8" --cache-control "$short"
          for a in amd64 arm64; do
            s3 cp "artifacts/dist/rebelsofgaming_${VERSION}_$a.deb" "$S3_BASE/rebelsofgaming_$a.deb" \
              --content-type application/vnd.debian.binary-package --cache-control "$short"
          done
          s3 cp external/rog-windows/src/RoG.App/Assets/rog-badge-512.png "$S3_BASE/icon-512.png" --content-type image/png --cache-control "public, max-age=86400"
          s3 sync packaging/screenshots "$S3_BASE/screenshots" --content-type image/png --cache-control "public, max-age=86400"

      - name: Über cdn.rogclan.de prüfen
        if: steps.s3.outputs.available == 'true'
        run: |
          for f in "$APP_ID.flatpakref" rebelsofgaming.flatpakrepo latest.json flatpak/summary; do
            if curl -fsSI "$CDN_BASE/$f" | grep -qi '^content-encoding: *aws-chunked'; then
              echo "::error::$CDN_BASE/$f wird mit Content-Encoding aws-chunked ausgeliefert"; exit 1
            fi
          done
          for f in artifacts/dist/*.deb; do
            url="$CDN_BASE/$VERSION/$(basename "$f")"
            test "$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$f.sha256")" \
              || { echo "::error::Prüfsumme über $url stimmt nicht"; exit 1; }
          done
          # Repo über das CDN lesen (ostree des Ubuntu-Archivs reicht dafür – kein PPA in diesem Job)
          sudo apt-get update -qq
          sudo apt-get install -y -qq ostree
          ostree init --mode=archive-z2 --repo="$RUNNER_TEMP/cdn-check"
          ostree --repo="$RUNNER_TEMP/cdn-check" remote add --gpg-import=artifacts/release/rebelsofgaming.gpg rog-cdn "$CDN_BASE/flatpak/"
          ostree --repo="$RUNNER_TEMP/cdn-check" remote refs rog-cdn

      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED: ${{ steps.s3.outputs.available }}
        run: |
          draft=()
          [ "$UPLOADED" = true ] || draft=(--draft)
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Rebels of Gaming für Linux $VERSION"
            echo
            echo "- **Flatpak (empfohlen, auch Steam Deck):** [$APP_ID.flatpakref]($CDN_BASE/$APP_ID.flatpakref) öffnen oder"
            echo "  \`flatpak install --user --from $CDN_BASE/$APP_ID.flatpakref\` – Updates kommen automatisch über das Repo."
            echo "- **Flatpak offline:** \`rebelsofgaming-${VERSION}-<x86_64|aarch64>.flatpak\` (Updates danach über das Repo)"
            echo "- **Debian/Ubuntu/Mint/Pop!_OS:** \`sudo apt install ./rebelsofgaming_${VERSION}_amd64.deb\` (arm64 ebenfalls angehängt)"
            echo "- Repo-Schlüssel (GPG): \`$GPG_KEY_ID\`"
            echo
            echo "Änderungen: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" "${draft[@]}" --verify-tag --title "v$VERSION" --notes-file "$notes" \
            --repo "$GITHUB_REPOSITORY" \
            artifacts/dist/*.deb artifacts/dist/*.tar.gz artifacts/dist/*.flatpak artifacts/dist/*.sha256 \
            "artifacts/release/$APP_ID.flatpakref" artifacts/release/rebelsofgaming.flatpakrepo
          [ "$UPLOADED" = true ] || echo "::notice::Release als Entwurf angelegt – Pakete liegen noch nicht auf cdn.rogclan.de"
