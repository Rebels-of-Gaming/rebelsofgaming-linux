name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build + Tests (Linux)
    # Öffentliches Repo: GitHub-Runner – Pull-Requests aus Forks laufen nie auf unseren eigenen Maschinen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # geteilter Kern (öffentliches Repo rebelsofgaming-windows)
          submodules: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Bibliotheken für Headless-Rendering prüfen
        run: |
          # SkiaSharp (Screenshots/Rauchtests) braucht libfontconfig; ohne Schriften rendert Text mit Ersatzschrift
          if ! ldconfig -p | grep -q libfontconfig.so.1; then
            echo "::warning::libfontconfig1 fehlt auf dem Runner – Screenshot-Tests könnten scheitern (apt install libfontconfig1 fonts-dejavu-core)"
          fi

      - run: dotnet build RoG.Linux.sln -c Release
      - run: dotnet test RoG.Linux.sln -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type none

  packaging:
    name: Paket-Dateien + .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream lintian

      - name: NuGet-Quellen, Schlüssel und Repo-Dateien
        run: python3 -I packaging/scripts/check-packaging.py

      - name: Shell-Skripte (shellcheck)
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck packaging/scripts/*.sh packaging/flatpak/rebelsofgaming.sh
          else
            echo "::warning::shellcheck nicht installiert – übersprungen"
          fi

      - name: Handbuchseite
        run: |
          out="$(LC_ALL=C.UTF-8 MANROFFSEQ='' MANWIDTH=80 man --warnings -E UTF-8 -l -Tutf8 -Z packaging/linux/rebelsofgaming.1 2>&1 >/dev/null)"
          [ -z "$out" ] || { echo "$out"; exit 1; }

      - name: Desktop-Datei und AppStream
        run: |
          desktop-file-validate packaging/linux/com.rebelsofgaming.RebelsOfGaming.desktop
          # Ohne Netz (Screenshots liegen erst nach dem ersten Release auf cdn.rogclan.de)
          appstreamcli validate --no-net --explain packaging/linux/com.rebelsofgaming.RebelsOfGaming.metainfo.xml

      - name: Tarball + .deb (x86_64)
        run: |
          packaging/scripts/make-tarball.sh x86_64
          packaging/scripts/make-deb.sh x86_64
          lintian --tag-display-limit 0 --fail-on error,warning artifacts/dist/rebelsofgaming_*_amd64.deb
