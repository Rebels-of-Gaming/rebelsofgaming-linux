# macOS-App (Mac App Store, Owner-Auftrag 03.11.2026): gleiche Oberfläche wie die Linux-App (src/RoG.Linux.App),
# macOS-Verdrahtung in src/RoG.Mac.Platform, Bundle-ID der iOS-App (com.rebelsofgaming.app, Universal Purchase).
#
# Auslöser:
#  - Push auf develop / workflow_dispatch → bauen, testen, Bundle bauen, ad-hoc signieren, Rauchtest (Start in der
#    Sandbox), unsigniertes Bundle als Artefakt. Es wird NIE etwas hochgeladen, Secrets werden nie geladen.
#  - Tag vX.Y.Z auf main → zusätzlich Job „App Store Connect“ (Umgebung „release“): mit „Apple Distribution“ signieren,
#    Provisioning-Profil einbetten, .pkg mit „Mac Installer Distribution“, prüfen und hochladen (altool + API-Schlüssel).
#    Fehlen die Secrets, wird das mit Hinweis übersprungen (der Lauf bleibt grün).
# Härtung wie release.yml: Actions per SHA gepinnt, contents: read, Secrets nur in den Schritten, die sie brauchen.
# Owner-Schritte (Zertifikate, Profil, API-Schlüssel, Secret-Namen): packaging/macos/README.md
name: macOS

on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      devid_sandbox_test:
        description: 'Sandbox-Start mit echter Signatur (Developer ID) testen – Diagnose zu Bauplan M9'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build, Tests, Bundle, Rauchtest
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version und Build-Nummer
        id: version
        run: |
          version="$(sed -n 's:.*<RoGLinuxVersion>\(.*\)</RoGLinuxVersion>.*:\1:p' Directory.Build.props)"
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zu RoGLinuxVersion $version (Directory.Build.props)"
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME liegt nicht auf main – Uploads nur von main (CLAUDE.md)"
              exit 1
            fi
            publish=true
          fi
          # CFBundleVersion muss je Upload steigen – fortlaufende Laufnummer dieses Workflows
          {
            echo "version=$version"
            echo "build=$GITHUB_RUN_NUMBER"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::macOS-App $version (Build $GITHUB_RUN_NUMBER), Upload: $publish"

      - name: Tests (macOS-Plattform + Kern)
        run: |
          dotnet test tests/RoG.Mac.Tests -c Release
          dotnet test external/rog-windows/tests/RoG.Core.Tests -c Release

      - name: App-Bundle bauen (arm64 + x64)
        env:
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          packaging/macos/make-app.sh arm64 "$BUILD"
          packaging/macos/make-app.sh x64 "$BUILD"

      - name: Unsignierte Bundles packen
        run: |
          for arch in arm64 x64; do
            ditto -c -k --sequesterRsrc --keepParent "artifacts/macos/$arch/Rebels of Gaming.app" \
              "artifacts/macos/rebelsofgaming-macos-$arch-unsigned.zip"
          done

      - name: Ad-hoc signieren und starten (Sandbox, Rauchtest)
        run: |
          crash_reports() {
            # Absturzberichte von macOS (Sandbox-Verletzung, Abbruch) zur Diagnose ausgeben
            local w
            for w in $(seq 1 45); do
              ls "$HOME/Library/Logs/DiagnosticReports"/rebelsofgaming* >/dev/null 2>&1 && break
              sleep 1
            done
            ls -la "$HOME/Library/Logs/DiagnosticReports" | tail -n 5 || true
            find "$HOME/Library/Logs/DiagnosticReports" -name 'rebelsofgaming*' -newer "$GITHUB_WORKSPACE/global.json" 2>/dev/null \
              | while read -r report; do
                  echo "== $report"
                  python3 -I -c '
          import json, sys
          text = open(sys.argv[1]).read()
          body = json.loads(text[text.index("\n") + 1:])
          for key in ("exception", "termination", "asi", "lastExceptionBacktrace"):
              if key in body: print(key, json.dumps(body[key])[:1500])
          images = body.get("usedImages", [])
          for thread in body.get("threads", []):
              if thread.get("triggered"):
                  for f in thread.get("frames", [])[:40]:
                      name = images[f["imageIndex"]].get("name", "?") if f.get("imageIndex", -1) < len(images) else "?"
                      print("  ", name, f.get("symbol", hex(f.get("imageOffset", 0))))
          ' "$report" || head -c 3000 "$report"
                done
            log show --last 3m --style compact --predicate 'process == "rebelsofgaming" OR eventMessage CONTAINS[c] "rebelsofgaming"' 2>/dev/null \
              | grep -v -E 'ContextStoreAgent|siriknowledged|nehelper|TransactionLog|AMFI|amfid' | tail -n 80 || true
            find "$HOME/Library/Containers/com.rebelsofgaming.app/Data" -maxdepth 4 \( -path '*/Library/*' -o -path '*/tmp*' \) 2>/dev/null | head -n 40 || true
          }
          smoke() {
            local arch="$1" prefix="$2" mode="$3" app="artifacts/macos/smoke-$1-$3/Rebels of Gaming.app"
            mkdir -p "artifacts/macos/smoke-$arch-$mode"
            ditto "artifacts/macos/$arch/Rebels of Gaming.app" "$app"
            if [ "$mode" = sandbox ]; then
              packaging/macos/sign-app.sh adhoc "$app"
            fi
            local log="artifacts/macos/smoke-$arch-$mode.log"
            if [ "$mode" = sandbox ] && [ -z "$prefix" ]; then
              # Sandbox-Apps müssen über LaunchServices starten (wie per Doppelklick) – direkt aus der Shell bricht
              # AppKit beim Anmelden bei launchservicesd ab
              : > "$log"
              open -W -n --env ROG_STARTUP_TRACE=1 --stdout "$PWD/$log" --stderr "$PWD/$log" "$app" --args --smoke-test &
            else
              $prefix "$app/Contents/MacOS/rebelsofgaming" --smoke-test >"$log" 2>&1 &
            fi
            local pid=$! i
            for i in $(seq 1 120); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid"
              cat "$log"
              crash_reports; echo "::error::Rauchtest $arch ($mode): App hat sich nach 120 s nicht beendet"
              return 1
            fi
            wait "$pid" || true
            # Sandbox: Meldung auch als Datei im Container-TMPDIR (stdout geht über LaunchServices nicht immer durch)
            find "$HOME/Library/Containers/com.rebelsofgaming.app/Data" -name rog-smoke-test.txt -newer "$app/Contents/Info.plist" \
              -exec cat {} \; >> "$log" 2>/dev/null || true
            cat "$log"
            grep -q 'rog-smoke-test: ok' "$log" || { crash_reports; echo "Rauchtest $arch ($mode): keine Erfolgsmeldung"; return 1; }
          }
          # erst ohne Sandbox (Laufzeit + Oberfläche), dann ad-hoc signiert in der Sandbox wie im Store
          smoke arm64 "" plain || { echo "::error::Rauchtest arm64 ohne Sandbox gescheitert"; exit 1; }
          # Sandbox-Start: auf den GitHub-Runnern bricht AppKit in [NSApplication sharedApplication] ab (launchservicesd
          # für den .NET-Prozess gesperrt; eine Swift-Referenz im selben Bundle startet). Bis zur Klärung auf einem
          # echten Mac/TestFlight nur Warnung – Diagnose steht oben im Log (Bauplan M9).
          if ! smoke arm64 "" sandbox; then
            echo "::warning::Rauchtest in der Sandbox (ad-hoc) gescheitert – auf echtem Mac/TestFlight prüfen (Bauplan M9)"
          fi
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            smoke x64 "arch -x86_64" plain || { echo "::error::Rauchtest x64 (Rosetta) gescheitert"; exit 1; }
          else
            echo "::notice::Rosetta 2 fehlt auf dem Runner – x64-Rauchtest übersprungen"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-unsigned-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: artifacts/macos/rebelsofgaming-macos-*-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  appstore:
    name: App Store Connect (signieren, .pkg, hochladen)
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/macos

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-unsigned-${{ needs.build.outputs.version }}-${{ needs.build.outputs.build }}
          path: artifacts/macos

      - name: Signier-Secrets vorhanden?
        id: secrets
        env:
          MAC_DIST_CERT_P12_BASE64: ${{ secrets.MAC_DIST_CERT_P12_BASE64 }}
          MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          missing=""
          for name in MAC_DIST_CERT_P12_BASE64 MAC_INSTALLER_CERT_P12_BASE64 MAC_PROVISIONING_PROFILE_BASE64 \
                      ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Signieren/Hochladen übersprungen – fehlende Secrets:$missing (packaging/macos/README.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zertifikate in temporären Schlüsselbund
        if: steps.secrets.outputs.ready == 'true'
        env:
          MAC_DIST_CERT_P12_BASE64: ${{ secrets.MAC_DIST_CERT_P12_BASE64 }}
          MAC_DIST_CERT_PASSWORD: ${{ secrets.MAC_DIST_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/rog-signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          printf '%s' "$MAC_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$MAC_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$MAC_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$MAC_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null
          # temporären Schlüsselbund vorn in die Suchliste
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          app_identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Apple Distribution: .*\)"/\1/p' | head -n1)"
          installer_identity="$(security find-identity -v "$keychain" | sed -nE 's/.*"((3rd Party Mac Developer Installer|Mac Installer Distribution): .*)"/\1/p' | head -n1)"
          if [ -z "$app_identity" ] || [ -z "$installer_identity" ]; then
            security find-identity -v "$keychain"
            echo "::error::„Apple Distribution“ bzw. „Mac Installer Distribution“ nicht im .p12 gefunden"
            exit 1
          fi
          {
            echo "MAC_SIGNING_KEYCHAIN=$keychain"
            echo "MAC_APP_IDENTITY=$app_identity"
            echo "MAC_INSTALLER_IDENTITY=$installer_identity"
          } >> "$GITHUB_ENV"

      - name: Signieren und .pkg bauen
        if: steps.secrets.outputs.ready == 'true'
        env:
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          ditto -x -k artifacts/macos/rebelsofgaming-macos-arm64-unsigned.zip artifacts/macos/store
          printf '%s' "$MAC_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.provisionprofile"
          packaging/macos/sign-app.sh store "artifacts/macos/store/Rebels of Gaming.app" \
            "$RUNNER_TEMP/profile.provisionprofile" "artifacts/macos/rebelsofgaming-$VERSION-$BUILD.pkg"
          rm -f "$RUNNER_TEMP/profile.provisionprofile"

      - name: Prüfen und zu App Store Connect hochladen
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          # Secret darf Base64 ODER der rohe Inhalt der .p8-Datei sein (im GitHub-Formular einfach einfügen)
          if printf '%s' "$ASC_API_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_API_KEY_P8_BASE64" > "$keys/AuthKey_$ASC_API_KEY_ID.p8"
          else
            printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$keys/AuthKey_$ASC_API_KEY_ID.p8"
          fi
          chmod 600 "$keys/AuthKey_$ASC_API_KEY_ID.p8"
          pkg="artifacts/macos/rebelsofgaming-$VERSION-$BUILD.pkg"
          xcrun altool --validate-app -f "$pkg" -t macos --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          xcrun altool --upload-app -f "$pkg" -t macos --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          rm -f "$keys/AuthKey_$ASC_API_KEY_ID.p8"
          echo "::notice::Build $VERSION ($BUILD) hochgeladen – in App Store Connect unter macOS → TestFlight/Builds prüfen"

      - name: Schlüsselbund aufräumen
        if: always() && env.MAC_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$MAC_SIGNING_KEYCHAIN" || true

  devid-sandbox-test:
    name: Sandbox-Test mit Developer-ID-Signatur (Diagnose M9)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.devid_sandbox_test
    runs-on: macos-15
    timeout-minutes: 40
    environment: release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/macos

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-unsigned-${{ needs.build.outputs.version }}-${{ needs.build.outputs.build }}
          path: artifacts/macos

      - name: Developer-ID-Zertifikat in temporären Schlüsselbund
        env:
          MAC_DEVID_CERT_P12_BASE64: ${{ secrets.MAC_DEVID_CERT_P12_BASE64 }}
          MAC_DEVID_CERT_PASSWORD: ${{ secrets.MAC_DEVID_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_DEVID_CERT_P12_BASE64" ]; then
            echo "::error::Secret MAC_DEVID_CERT_P12_BASE64 fehlt"; exit 1
          fi
          keychain="$RUNNER_TEMP/rog-devid.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          printf '%s' "$MAC_DEVID_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -P "$MAC_DEVID_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n1)"
          [ -n "$identity" ] || { echo "::error::Kein „Developer ID Application“ im .p12"; exit 1; }
          echo "MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MAC_DEVID_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Signieren (Hardened Runtime + Sandbox, ohne Profil) und prüfen
        run: |
          mkdir -p diag
          ditto -x -k artifacts/macos/rebelsofgaming-macos-arm64-unsigned.zip artifacts/macos/devid
          app="artifacts/macos/devid/Rebels of Gaming.app"
          packaging/macos/sign-app.sh devid "$app" 2>&1 | grep -v 'replacing existing signature' | tail -n 5
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -n 3
          codesign --display --entitlements - --xml "$app" > diag/entitlements.plist 2>/dev/null || true
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Runtime|flags' | tee diag/codesign.txt
          spctl -a -vv "$app" 2>&1 | tee diag/spctl-before-notarization.txt || true

      - name: Notarisieren und heften (optional)
        continue-on-error: true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          if printf '%s' "$ASC_API_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_API_KEY_P8_BASE64" > "$key"
          else
            printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          app="artifacts/macos/devid/Rebels of Gaming.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" --wait --timeout 20m 2>&1 | tee diag/notarytool.txt
          rm -f "$key"
          xcrun stapler staple "$app" 2>&1 | tee diag/stapler.txt
          spctl -a -vv "$app" 2>&1 | tee diag/spctl-after-notarization.txt || true

      - name: Starten (Sandbox) und beobachten
        run: |
          app="$PWD/artifacts/macos/devid/Rebels of Gaming.app"
          touch "$RUNNER_TEMP/start-marker"
          # 1) normaler Start wie per Doppelklick – lebt der Prozess nach 25 s noch?
          open -n "$app"
          sleep 25
          if pgrep -x rebelsofgaming > diag/pid.txt; then
            echo "::notice::App läuft nach 25 s (PID $(cat diag/pid.txt)) – Sandbox-Start mit Developer-ID-Signatur OK"
            echo "alive" > diag/result.txt
          else
            echo "::warning::App läuft nach 25 s NICHT mehr – Absturz in der Sandbox auch mit echter Signatur"
            echo "dead" > diag/result.txt
          fi
          screencapture -x diag/screen.png || true
          pkill -x rebelsofgaming || true
          sleep 3
          # 2) Rauchtest-Lauf (meldet sich selbst und beendet sich)
          : > diag/smoke.log
          open -W -n --env ROG_STARTUP_TRACE=1 --stdout "$PWD/diag/smoke.log" --stderr "$PWD/diag/smoke.log" "$app" --args --smoke-test &
          opener=$!
          for i in $(seq 1 90); do kill -0 "$opener" 2>/dev/null || break; sleep 1; done
          kill "$opener" 2>/dev/null || true
          pkill -x rebelsofgaming || true
          find "$HOME/Library/Containers/com.rebelsofgaming.app/Data" -name rog-smoke-test.txt -exec cat {} \; >> diag/smoke.log 2>/dev/null || true
          cat diag/smoke.log
          # 3) Absturzberichte und Protokolle
          sleep 10
          find "$HOME/Library/Logs/DiagnosticReports" -name 'rebelsofgaming*' -newer "$RUNNER_TEMP/start-marker" -exec cp {} diag/ \; 2>/dev/null || true
          ls diag
          log show --last 5m --style compact --predicate 'process == "rebelsofgaming"' > diag/log-process.txt 2>/dev/null || true
          log show --last 5m --style compact --predicate 'sender == "Sandbox" OR subsystem == "com.apple.sandbox.reporting"' \
            | grep -i rebelsofgaming > diag/log-sandbox.txt 2>/dev/null || true
          log show --last 5m --style compact --predicate 'eventMessage CONTAINS "rebelsofgaming" AND (process == "launchd" OR process == "secinitd")' \
            > diag/log-launchd.txt 2>/dev/null || true
          echo "--- Sandbox-Verweigerungen ---"; grep -E 'deny' diag/log-sandbox.txt | head -n 40 || true
          echo "--- launchd ---"; grep -E 'denied|SIGABRT|exited' diag/log-launchd.txt | head -n 20 || true
          for report in diag/rebelsofgaming*.ips; do
            [ -f "$report" ] || continue
            echo "== $report"
            python3 -I -c '
          import json, sys
          text = open(sys.argv[1]).read()
          body = json.loads(text[text.index("\n") + 1:])
          for key in ("exception", "termination", "asi"):
              if key in body: print(key, json.dumps(body[key])[:800])
          images = body.get("usedImages", [])
          for thread in body.get("threads", []):
              if thread.get("triggered"):
                  for f in thread.get("frames", [])[:25]:
                      i = f.get("imageIndex", -1)
                      name = images[i].get("name", "?") if 0 <= i < len(images) else "?"
                      print("  ", name, f.get("symbol", hex(f.get("imageOffset", 0))))
          ' "$report" || true
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-devid-sandbox-diagnose-${{ needs.build.outputs.build }}
          path: diag/
          if-no-files-found: warn
          retention-days: 14

      - name: Schlüsselbund aufräumen
        if: always() && env.MAC_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$MAC_SIGNING_KEYCHAIN" || true
