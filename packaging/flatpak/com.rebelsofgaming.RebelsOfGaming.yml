# ENTWURF – Flatpak-Manifest der Linux-App. Nicht bei Flathub eingereicht (nur auf Auftrag des Owners).
#
# Offene Punkte vor einer Einreichung (docs/LINUX-BAUPLAN.md, Stufe 10 und offene Fragen):
#  - F1: Flathub baut nur aus öffentlich abrufbaren Quellen. Dieses Repo und das Submodul rebelsofgaming-windows sind
#        privat → entweder Quellen veröffentlichen oder fertige Binärpakete (Tarball je Architektur aus der CI) öffentlich
#        ablegen (z. B. cdn.rogclan.de) und hier als `type: archive` mit sha256 einbinden (proprietäre Apps erlaubt).
#  - Offline-Build: Flathub erlaubt kein Netz beim Bauen → NuGet-Pakete vorab mit flatpak-dotnet-generator.py
#        (flatpak-builder-tools) in nuget-sources.json erfassen und mit `--source ./nuget-sources` restoren.
#  - Avalonia 11 nutzt X11 (unter Wayland über XWayland) → `--socket=x11` statt `fallback-x11`.
#
# Lokal bauen (mit Netz, nur zum Testen):
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/com.rebelsofgaming.RebelsOfGaming.yml
#   flatpak run com.rebelsofgaming.RebelsOfGaming
id: com.rebelsofgaming.RebelsOfGaming
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: rebelsofgaming

finish-args:
  # API, Bilder vom CDN, Loopback-Rücksprung des Logins (127.0.0.1)
  - --share=network
  # Avalonia 11: X11 (XWayland unter Wayland); GPU-Beschleunigung
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Geräte-Token im Schlüsselbund (Secret Service); später ggf. Secret-Portal
  - --talk-name=org.freedesktop.secrets
  # Desktop-Benachrichtigungen (später ggf. Notification-Portal)
  - --talk-name=org.freedesktop.Notifications
  # Steam Deck: Steam-Overlay/Gamescope-Eingaben brauchen nichts weiter; Controller über SDL folgt in Stufe 10

build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_NOLOGO: '1'
  arch:
    x86_64:
      env:
        RUNTIME: linux-x64
    aarch64:
      env:
        RUNTIME: linux-arm64

modules:
  - name: rebelsofgaming
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/Rebels-of-Gaming/rebelsofgaming-linux.git
        branch: develop
        # Für Releases: tag + commit statt branch
      # - nuget-sources.json   # erzeugt mit flatpak-dotnet-generator.py (Offline-Build)
    build-commands:
      - dotnet publish src/RoG.Linux.App/RoG.Linux.App.csproj -c Release -r $RUNTIME --self-contained true
        -p:PublishTrimmed=false -o /app/lib/rebelsofgaming
      - mkdir -p /app/bin && printf '#!/bin/sh\nexec /app/lib/rebelsofgaming/rebelsofgaming "$@"\n' > /app/bin/rebelsofgaming
        && chmod 755 /app/bin/rebelsofgaming
      - install -Dm644 packaging/linux/com.rebelsofgaming.RebelsOfGaming.desktop -t /app/share/applications
      - install -Dm644 packaging/linux/com.rebelsofgaming.RebelsOfGaming.metainfo.xml -t /app/share/metainfo
      - install -Dm644 external/rog-windows/src/RoG.App/Assets/rog-badge-512.png /app/share/icons/hicolor/512x512/apps/com.rebelsofgaming.RebelsOfGaming.png
      - install -Dm644 external/rog-windows/src/RoG.App/Fonts/OFL.txt /app/share/licenses/com.rebelsofgaming.RebelsOfGaming/OFL-BarlowCondensed.txt
