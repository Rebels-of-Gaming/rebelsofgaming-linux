# Flatpak-Manifest der Linux-App für das EIGENE Flatpak-Repository (Owner-Entscheidung F15, 31.10.2026):
#   https://cdn.rogclan.de/apps/linux/flatpak/  (Bucket rog-public, Präfix apps/linux/flatpak/, GPG-signiert)
# Nicht für Flathub – Flathub nimmt keine KI-erstellten Manifeste/PRs an (F15 in docs/LINUX-BAUPLAN.md).
#
# Gebaut wird aus dem Quelltext (GPL-3.0-or-later, F10) ohne Netz: alle NuGet-Pakete stehen in nuget-sources.json
# (Format von flatpak-dotnet-generator; neu erzeugen mit packaging/scripts/update-nuget-sources.sh nach jeder
# Paketänderung – die CI prüft, dass alle Paketversionen enthalten sind).
#  - F2: App-ID com.rebelsofgaming.RebelsOfGaming (endgültig) – gleich in .desktop, AppStream, Symbol, D-Bus-Namen
#        (Single-Instance), Schlüsselbund-Attribut, WM-Klasse (X11) und xdg_toplevel-App-ID (Wayland).
#  - F3: Avalonia 12 mit nativem Wayland → wayland + fallback-x11 statt erzwungenem X11.
#
# Lokal bauen und testen: packaging/scripts/flatpak-build.sh (Anleitung packaging/README.md).
# Release: .github/workflows/release.yml (x86_64 und aarch64 nativ auf GitHub-Runnern, Branch „stable“).
id: com.rebelsofgaming.RebelsOfGaming
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: rebelsofgaming

finish-args:
  # Netz: API, Echtzeit (Reverb), Bilder über die Plattform, Loopback-Rücksprung des Browser-Logins (127.0.0.1)
  - --share=network
  # Anzeige: Avalonia 12 spricht natives Wayland; ohne Wayland-Sitzung (und im Spielmodus des Steam Deck/Gamescope)
  # X11 bzw. XWayland. fallback-x11 gibt X11 nur frei, wenn keine Wayland-Sitzung läuft.
  - --socket=wayland
  - --socket=fallback-x11
  # Nur für den X11-Rückfall: gemeinsamer Speicher (MIT-SHM) zum Zeichnen – ohne ist X11 sehr langsam
  - --share=ipc
  # GPU-Beschleunigung (EGL/OpenGL über Skia); ohne Recht zeichnet die App deutlich langsamer in Software
  - --device=dri
  # Controller (Steam Deck, Gamepads) über SDL: /dev/input (evdev; Hot-Plug per inotify, udev gibt es in der Sandbox
  # nicht). Bewusst nicht --device=all: das gäbe Zugriff auf alle Geräte (Kamera, USB …). Folge: SDL-HIDAPI über
  # /dev/hidraw* fällt weg (Sonderfunktionen einzelner Controller wie Gyro/Touchpad); Tasten und Sticks gehen über
  # evdev. Im Spielmodus des Steam Deck liefert Steam Input ohnehin einen virtuellen Controller unter /dev/input.
  # Braucht Flatpak ≥ 1.15.6 – ältere Versionen ignorieren das Recht, dann bleibt die App ohne Controller bedienbar.
  # SDL selbst bringt die Runtime mit (freedesktop 26.08: SDL3 + sdl2-compat).
  - --device=input
  # Geräte-Token und Offline-Schlüssel im Schlüsselbund (Secret Service, org.freedesktop.secrets). Das Secret-Portal
  # liefert nur einen Schlüssel je App, keine benannten Einträge je Umgebung – deshalb (noch) direkt.
  - --talk-name=org.freedesktop.secrets
  # Tray-Symbol (StatusNotifierItem): Anmeldung beim Watcher des Panels mit dem eindeutigen Busnamen – kein eigener
  # Name nötig. Ohne Panel (GNOME ohne AppIndicator-Erweiterung) beendet das Schließen des Fensters die App.
  - --talk-name=org.kde.StatusNotifierWatcher
  # App-Sperre: optional Entsperren per Fingerabdruck über fprintd (System-Bus). Die Berechtigung prüft fprintd selbst
  # per Polkit (net.reactivated.fprint.device.verify, aktive Sitzung ohne Rückfrage) – die App bringt keine Regel mit.
  - --system-talk-name=net.reactivated.Fprint
  # Medien → Downloads speichert in den Downloads-Ordner des Benutzers und zeigt die Datei dort („Im Ordner zeigen“).
  # Uploads, Einreichen und Anhänge wählen Dateien über das FileChooser-Portal und brauchen kein Dateisystem-Recht.
  - --filesystem=xdg-download
  # Ohne weiteres Recht:
  #  - Single-Instance: die App besitzt ihre App-ID als D-Bus-Namen (Flatpak erlaubt den eigenen Namen immer)
  #  - Portale: Benachrichtigungen (Notification), Autostart beim Anmelden (Background, fragt einmal nach),
  #    Dateiauswahl (FileChooser), Bildschirmfoto hochladen (Screenshot), Farbschema „Wie das System“ (Settings),
  #    Links, rog:// an Spiele und den Browser (OpenURI)

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_NOLOGO: 'true'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

modules:
  - name: rebelsofgaming
    buildsystem: simple
    build-options:
      # Self-contained .NET (Laufzeit, SkiaSharp, HarfBuzz aus NuGet): ohne Symbole gebaut (DebugType=none); fremde
      # .so nicht strippen und keine Debug-Erweiterung abspalten
      no-debuginfo: true
      strip: false
      arch:
        x86_64:
          env:
            ROG_RID: linux-x64
        aarch64:
          env:
            ROG_RID: linux-arm64
    sources:
      # Der Quelltext dieses Repos samt Submodul external/rog-windows (Kern). In der CI ist das der saubere Checkout,
      # lokal ein Abzug der versionierten Dateien (packaging/scripts/flatpak-build.sh) – nie bin/, obj/, artifacts/.
      - type: dir
        path: ../..
        skip:
          - artifacts
          - .flatpak-builder
      # Alle NuGet-Pakete (linux-x64 + linux-arm64, inkl. Laufzeit-, AppHost- und Crossgen2-Paketen) für den
      # Restore ohne Netz
      - nuget-sources.json
    build-commands:
      # ReadyToRun wie Tarball/.deb (schneller Start, Stufe 10), kein Trimming (Reflexion in Kern/Avalonia, L60)
      - >-
        dotnet publish src/RoG.Linux.App/RoG.Linux.App.csproj -c Release -r "$ROG_RID" --self-contained true
        --source "$PWD/nuget-sources" -p:PublishTrimmed=false -p:PublishReadyToRun=true -p:DebugType=none
        -p:PublishDocumentationFiles=false -o /app/lib/rebelsofgaming
      - install -Dm755 packaging/flatpak/rebelsofgaming.sh /app/bin/rebelsofgaming
      - install -Dm644 packaging/linux/com.rebelsofgaming.RebelsOfGaming.desktop -t /app/share/applications
      - install -Dm644 packaging/linux/com.rebelsofgaming.RebelsOfGaming.metainfo.xml -t /app/share/metainfo
      - install -Dm644 external/rog-windows/src/RoG.App/Assets/rog-badge-512.png /app/share/icons/hicolor/512x512/apps/com.rebelsofgaming.RebelsOfGaming.png
      - install -Dm644 LICENSE -t /app/share/licenses/com.rebelsofgaming.RebelsOfGaming
      - install -Dm644 TRADEMARKS.md -t /app/share/licenses/com.rebelsofgaming.RebelsOfGaming
      - install -Dm644 external/rog-windows/src/RoG.App/Fonts/OFL.txt /app/share/licenses/com.rebelsofgaming.RebelsOfGaming/OFL-BarlowCondensed.txt
